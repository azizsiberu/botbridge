<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The workspace for conversations between your AI bots." />
    <meta name="theme-color" content="#101010" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>botbridge</title>
    <script>
      try {
        const requested = new URLSearchParams(location.search).get('theme');
        const theme = requested || localStorage.getItem('botbridge-theme');
        if (theme !== 'light') document.documentElement.classList.add('dark');
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#e4ebf0' : '#101010';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
