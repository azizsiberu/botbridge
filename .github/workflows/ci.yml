name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: botbridge
          POSTGRES_PASSWORD: botbridge
          POSTGRES_DB: botbridge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botbridge -d botbridge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix web
      - run: npm run build --prefix web
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
        env:
          DATABASE_URL: postgres://botbridge:botbridge@127.0.0.1:5432/botbridge_test
          BOTBRIDGE_SECRET: test-secret-not-for-production
          LOG_LEVEL: silent

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose build
